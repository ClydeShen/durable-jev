# The full quality gate. Commit hooks run only the fast checks; this runs everything.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MODEL_MODE: scripted
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Node and gitleaks at the versions in mise.toml; pnpm at the packageManager version.
      - uses: jdx/mise-action@v5
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lint, workspace, types, boundaries, architecture graph, protected files, dead code, duplication, tests
        run: pnpm check
      - name: Replay the demo cases
        run: pnpm replay
      - name: Fault scenarios
        run: pnpm faults
      - name: Policy change continuity and restart controls
        run: pnpm eval:policy-change
      - name: Dependency vulnerabilities
        run: pnpm security
      - name: Secrets in history
        run: gitleaks git --redact --no-banner .
      - name: Commit messages of this pull request
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  # The demo has to start on Windows too: build, then run the tests, the replay and the fault
  # scenarios, which start and kill real processes.
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      MODEL_MODE: scripted
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/materials-lock.mjs --check
      - run: pnpm test
      - run: pnpm replay
      - run: pnpm faults
      - run: pnpm eval:policy-change
