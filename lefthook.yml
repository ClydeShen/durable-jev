# Fast checks at commit time; the full `pnpm check` runs in CI.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc,css}"
      run: pnpm exec biome check --error-on-warnings --no-errors-on-unmatched {staged_files}
    - name: gitleaks
      run: node scripts/gitleaks-staged.mjs

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
